name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['basetobase/**', '.basetobase/**', '.github/workflows/basetobase-*.yml']
  pull_request:
    paths-ignore: ['basetobase/**', '.basetobase/**', '.github/workflows/basetobase-*.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - run: make check-api
      - run: go test ./... -count=1 -race
