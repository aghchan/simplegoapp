name: basetobase-ci
on:
  push:
    branches: [main]
    paths: ['basetobase/**', '.basetobase/**', '.github/workflows/basetobase-*.yml']
  pull_request:
    paths: ['basetobase/**', '.basetobase/**', '.github/workflows/basetobase-*.yml']
  # Deploys main by hand, e.g. right after `npm run setup:deploy`.
  workflow_dispatch:
permissions:
  contents: read
# main's runs queue one at a time in push order, and a newer push replaces one still waiting, so
# main's newest commit always deploys last. A group on the deploy job alone would queue jobs in the
# order they reach it: an older run's deploy could cancel a newer one waiting. Pull requests queue
# per branch.
concurrency:
  group: basetobase-ci-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: basetobase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test

  # Whether main's Worker needs a deploy, asked of the live version's /health. No secrets, so a
  # change the Worker does not ship never opens the production environment.
  plan:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    defaults:
      run:
        working-directory: basetobase
    steps:
      - uses: actions/checkout@v4
        with:
          # The live version's commit is compared with this one.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        run: node scripts/src/ci-deploy.ts plan
        env:
          BASETOBASE_URL: ${{ vars.BASETOBASE_URL }}
          DEPLOY_SHA: ${{ github.sha }}

  # Migrate, deploy, check /health serves this commit, roll back if it never does
  # (scripts/src/ci-deploy-lib.ts). Only main can use the production environment's secrets.
  deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BASETOBASE_URL }}
    defaults:
      run:
        working-directory: basetobase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node scripts/src/ci-deploy.ts deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BASETOBASE_URL: ${{ vars.BASETOBASE_URL }}
          DEPLOY_SHA: ${{ github.sha }}
